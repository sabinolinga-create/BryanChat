
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bryanchat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bryanchat.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
