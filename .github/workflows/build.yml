
      - name: Build TDLib
        run: |
          cd tdlib
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$HOME/android-sdk/ndk/27.2.12479018/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --parallel 2
