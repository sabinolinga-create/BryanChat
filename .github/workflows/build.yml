
name: Build BryanChat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout BryanChat
        uses: actions/checkout@v4

      - name: Download TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: tdlib

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gperf php-cli perl make cmake ninja-build wget unzip zip

      - name: Install Android SDK and NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip -d /tmp/android
          mv /tmp/android/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "ndk;23.2.8568313" "cmake;3.22.1" "platforms;android-34"

      - name: Build OpenSSL for Android
        run: |
          cd tdlib/example/android
          bash build-openssl.sh $HOME/android-sdk 23.2.8568313

      - name: Build TDLib for Android
        run: |
          cd tdlib/example/android
          bash build-tdlib.sh $HOME/android-sdk 23.2.8568313

      - name: Verify generated files
        run: |
          ls -lah tdlib/example/android/tdlib/
          test -f tdlib/example/android/tdlib/tdlib.zip
          test -d tdlib/example/android/tdlib/libs

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: BryanChat-TDLib-Android
          path: tdlib/example/android/tdlib/
          if-no-files-found: error
          retention-days: 7
