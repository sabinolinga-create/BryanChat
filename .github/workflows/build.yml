
name: Build BryanChat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: tdlib

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gperf php-cli perl unzip zip wget

      - name: Install Android SDK and NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip -d /tmp/android
          mv /tmp/android/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "ndk;23.2.8568313" "cmake;3.22.1" "platforms;android-34"

      - name: Build TDLib Android
        run: |
          cd tdlib/example/android
          chmod +x check-environment.sh build-openssl.sh build-tdlib.sh
          ./check-environment.sh
          ./build-openssl.sh $HOME/android-sdk 23.2.8568313
          ./build-tdlib.sh $HOME/android-sdk 23.2.8568313

      - name: Upload TDLib
        uses: actions/upload-artifact@v4
        with:
          name: BryanChat-TDLib-Android
          path: |
            tdlib/example/android/tdlib.zip
            tdlib/example/android/tdlib-debug.zip
            tdlib/example/android/libs/
            tdlib/example/android/java/
