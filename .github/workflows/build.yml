
name: Build BryanChat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout BryanChat
        uses: actions/checkout@v4

      - name: Download TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: tdlib

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gperf php-cli perl make cmake ninja-build wget unzip zip

      - name: Install Android SDK and NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip -d /tmp/android
          mv /tmp/android/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "ndk;23.2.8568313" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build OpenSSL for Android
        run: |
          cd tdlib/example/android
          bash build-openssl.sh $HOME/android-sdk 23.2.8568313

      - name: Build TDLib for Android
        run: |
          cd tdlib/example/android
          bash build-tdlib.sh $HOME/android-sdk 23.2.8568313
      - name: Integrate TDLib into BryanChat
        run: |
          mkdir -p app/src/main/jniLibs
          mkdir -p app/src/main/java
          cp -a tdlib/example/android/tdlib/libs/. app/src/main/jniLibs/
          cp -a tdlib/example/android/tdlib/java/org app/src/main/java/
                - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build BryanChat APK
        run: gradle assembleDebug

      - name: Upload BryanChat APK
        uses: actions/upload-artifact@v4
        with:
          name: BryanChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated files
        run: |
          ls -lah tdlib/example/android/tdlib/
          test -f tdlib/example/android/tdlib/tdlib.zip
          test -d tdlib/example/android/tdlib/libs

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: BryanChat-TDLib-Android
          path: tdlib/example/android/tdlib/
          if-no-files-found: error
          retention-days: 7
